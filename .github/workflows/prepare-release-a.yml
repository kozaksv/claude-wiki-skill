name: Prepare release A review snapshot
on:
  push:
    branches: [work/wiki-release-a-build]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply pinned changes
        id: patch
        run: python3 .github/prepare-release-a.py
      - name: Run complete regression suites
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          result=0
          python3 scripts/build_skill.py --check || result=1
          python3 -m unittest discover -s tests -p 'test_*.py' -v || result=1
          bash tests/skill-contracts.sh || result=1
          bash tests/install-cross-agent-links.sh || result=1
          bash tests/uninstall.sh || result=1
          echo "REGRESSION_RESULT=$result"
          exit "$result"
      - name: Publish review snapshot, preserving test results
        if: ${{ always() && steps.patch.outcome == 'success' }}
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Assemble release A source and regression tests'
          git push origin HEAD:work/wiki-release-a-build
          echo "REVIEW_COMMIT=$(git rev-parse HEAD)"
          echo "REVIEW_TREE=$(git rev-parse HEAD^{tree})"
          echo "TEST_OUTCOME=$TEST_OUTCOME"
