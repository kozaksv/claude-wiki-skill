name: PR15 review candidate validation
on:
  push:
    branches: [work/pr15-review-build-20261005]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: prepare
        shell: bash
        run: |
          set -euo pipefail
          base=c0493bd61bead5e99fb5ab2594c5f9002237cd3c
          git checkout --detach "$base"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_wiki_tools.py')
          text = path.read_text()
          assert text.count('root = Path(directory)') == 3
          path.write_text(text.replace('root = Path(directory)', 'root = Path(directory).resolve()'))
          PY
          test ! -e .github/pr15-review-patch.py
          test ! -e .github/workflows/pr15-review-check.yml
          git add -- tests/test_wiki_tools.py
          git diff --cached --check
          git config user.name 'kozaksv'
          git config user.email 'kozaksv@users.noreply.github.com'
          tree=$(git write-tree)
          commit=$(printf '%s\n' 'test: resolve legacy discovery fixture roots on macOS' | git commit-tree "$tree" -p "$base")
          git push origin "$commit:refs/heads/work/pr15-review-candidate-20261005"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "CANDIDATE_COMMIT=$commit"
          echo "CANDIDATE_TREE=$tree"
  tests:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - run: python3 scripts/build_skill.py --check
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: bash tests/skill-contracts.sh
      - run: bash tests/install-cross-agent-links.sh
      - run: bash tests/uninstall.sh
